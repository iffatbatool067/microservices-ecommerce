name: CD - Staging

on:
  push:
    branches: [staging]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Docker Build & Push Staging
        run: |
          docker build -t iffatbatool/shopcloud-frontend:staging .
          docker push iffatbatool/shopcloud-frontend:staging
      - name: Deploy to Staging
        run: echo "Deployed to Staging!"
